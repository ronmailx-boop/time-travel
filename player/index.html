<title>חזרה בזמן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-screen 360 view; a thin control bar floats at the bottom, a start veil on top. Single dark look by choice. */
:root {
  --ink: #f3efe6;
  --ink-dim: rgba(243, 239, 230, .72);
  --glass: rgba(16, 20, 24, .58);
  --glass-line: rgba(243, 239, 230, .16);
  --accent: #e8b04a;
  --night: #0c1014;
  --font-display: "Heebo", "Arial Hebrew", system-ui, sans-serif;
  --font-body: "Assistant", "Arial Hebrew", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; direction: rtl; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
#stage canvas { display: block; width: 100%; height: 100%; }

.veil {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
  background: radial-gradient(ellipse at center, rgba(12,16,20,.35), rgba(12,16,20,.9));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.veil-inner { display: grid; gap: 14px; justify-items: center; text-align: center; max-width: 30rem; }
.date { font-family: var(--font-display); font-weight: 300; letter-spacing: .32em; font-size: .8rem; color: var(--accent); direction: ltr; }
.veil h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3.6rem); line-height: 1; text-wrap: balance; }
.veil p { margin: 0; color: var(--ink-dim); font-size: 1.05rem; line-height: 1.5; }
.go {
  margin-top: 8px; font: 700 1.1rem var(--font-display); color: var(--night); background: var(--accent);
  border: 0; border-radius: 999px; padding: 14px 30px; cursor: pointer;
}
.go:focus-visible, .bar button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.status { min-height: 1.4em; font-size: .9rem; color: var(--ink-dim); }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-top: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px;
  background: linear-gradient(to top, rgba(12,16,20,.75), rgba(12,16,20,0));
}
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar button {
  font: 600 .95rem var(--font-body); color: var(--ink); background: var(--glass);
  border: 1px solid var(--glass-line); border-radius: 999px; padding: 9px 16px; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.time { margin-inline-start: auto; font-variant-numeric: tabular-nums; color: var(--ink-dim); font-size: .9rem; direction: ltr; }
.track { height: 3px; background: var(--glass-line); border-radius: 3px; overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--accent); }
.hint { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; z-index: 3;
  color: var(--ink-dim); font-size: .9rem; pointer-events: none; transition: opacity .8s; }
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;800&family=Assistant:wght@400;600;700&display=swap">

<div id="stage" aria-label="תצוגת 360 מעלות. גוררים כדי להסתכל מסביב"></div>
<div class="hint" id="hint">גוררים באצבע כדי להסתכל מסביב · צובטים כדי להתקרב</div>

<div class="veil" id="veil">
  <div class="veil-inner">
    <div class="date">18 · 07 · 2023 — 15:20</div>
    <h1>חזרה בזמן</h1>
    <p>עומדים על המרפסת מעל האגם. הסרטון מתנגן במקום שבו צולם, וכל השאר מסביבך.</p>
    <button class="go" id="go" disabled>טוען…</button>
    <div class="status" id="status" role="status"></div>
  </div>
</div>

<div class="bar" id="bar" hidden>
  <div class="track"><i id="prog"></i></div>
  <div class="row">
    <button id="play" type="button">השהיה</button>
    <button id="follow" type="button" aria-pressed="true">עקוב אחרי המצלמה</button>
    <button id="center" type="button">לסרטון</button>
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
</div>

<video id="vid" src="video.mp4" playsinline loop preload="auto" crossorigin="anonymous" hidden></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const statusEl = document.getElementById('status');
  const goBtn = document.getElementById('go');
  const vid = document.getElementById('vid');
  const fail = (msg) => { statusEl.textContent = msg; goBtn.textContent = 'לא נטען'; };
  if (!window.THREE) { fail('לא הצלחתי לטעון את מנוע התלת-ממד. בדוק את החיבור ונסה לרענן.'); return; }

  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  camera.rotation.order = 'YXZ';

  // World: a sphere painted with the equirectangular image (lon 0 = straight ahead = -Z, east = +X)
  const sphereMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { map: { value: null } },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D map; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir);
        float lon = atan(d.x, -d.z); float lat = asin(clamp(d.y,-1.0,1.0));
        vec2 uv = vec2(lon / 6.2831853 + 0.5, 0.5 + lat / 3.1415927);
        gl_FragColor = texture2D(map, uv); }`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 96, 64), sphereMat));

  // The original video: a plane placed where the camera was pointing, edges feathered into the world
  const vtex = new THREE.VideoTexture(vid);
  vtex.minFilter = THREE.LinearFilter; vtex.magFilter = THREE.LinearFilter;
  const planeMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { map: { value: vtex }, feather: { value: 0.07 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D map; uniform float feather; varying vec2 vUv;
      void main(){ vec4 c = texture2D(map, vUv);
        float fx = smoothstep(0.0, feather, vUv.x) * smoothstep(0.0, feather, 1.0 - vUv.x);
        float fy = smoothstep(0.0, feather * 0.6, vUv.y) * smoothstep(0.0, feather * 0.6, 1.0 - vUv.y);
        gl_FragColor = vec4(c.rgb, fx * fy); }`
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), planeMat);
  plane.renderOrder = 1;
  scene.add(plane);

  let track = null;
  const D = 100;
  function sampleTrack(t) {
    const T = track.t; let i = 0;
    if (t <= T[0]) i = 0; else if (t >= T[T.length - 1]) i = T.length - 2;
    else { while (i < T.length - 2 && T[i + 1] < t) i++; }
    const a = Math.min(1, Math.max(0, (t - T[i]) / ((T[i + 1] - T[i]) || 1)));
    const L = (k) => track[k][i] + (track[k][i + 1] - track[k][i]) * a;
    return { lon: L('lon'), lat: L('lat'), roll: L('roll'), scale: L('scale') };
  }
  function dirOf(lon, lat) { return new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), -Math.cos(lat) * Math.cos(lon)); }
  function placeVideo(s) {
    const angH = (track.frame_h * s.scale) / track.f;
    const h = 2 * D * Math.tan(angH / 2);
    const w = h * (vid.videoWidth && vid.videoHeight ? vid.videoWidth / vid.videoHeight : track.frame_w / track.frame_h);
    plane.scale.set(w, h, 1);
    plane.position.copy(dirOf(s.lon, s.lat).multiplyScalar(D));
    plane.lookAt(0, 0, 0);
    plane.rotateZ(-s.roll);
  }

  // Looking around: drag + pinch; optional follow of the original camera
  let yaw = 0, pitch = 0, follow = true, fov = 75;
  const followBtn = document.getElementById('follow');
  const setFollow = (on) => { follow = on; followBtn.setAttribute('aria-pressed', String(on)); };
  followBtn.addEventListener('click', () => setFollow(!follow));
  document.getElementById('center').addEventListener('click', () => { if (track) { const s = sampleTrack(vid.currentTime); yaw = s.lon; pitch = s.lat; } });
  const pts = new Map(); let pinch0 = 0, fov0 = fov;
  stage.addEventListener('pointerdown', (e) => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); fov0 = fov; } });
  stage.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId); if (!p) return;
    if (pts.size === 1) {
      const k = (fov / 75) * 0.0042;
      yaw -= (e.clientX - p.x) * k; pitch += (e.clientY - p.y) * k;
      pitch = Math.max(-1.5, Math.min(1.5, pitch));
      if (follow) setFollow(false);
      hideHint();
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch0) fov = Math.max(30, Math.min(100, fov0 * pinch0 / d));
    }
    p.x = e.clientX; p.y = e.clientY;
  });
  const up = (e) => { pts.delete(e.pointerId); pinch0 = 0; };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', (e) => { e.preventDefault(); fov = Math.max(30, Math.min(100, fov + e.deltaY * 0.03)); }, { passive: false });
  let hintT = null; const hintEl = document.getElementById('hint');
  function hideHint() { if (!hintT) hintT = setTimeout(() => { hintEl.style.opacity = '0'; }, 400); }

  function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();

  const prog = document.getElementById('prog'); const timeEl = document.getElementById('time');
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function frame() {
    if (track) {
      const s = sampleTrack(vid.currentTime || 0);
      placeVideo(s);
      if (follow) { yaw += (s.lon - yaw) * 0.08; pitch += (s.lat - pitch) * 0.08; }
    }
    camera.fov += (fov - camera.fov) * 0.2; camera.updateProjectionMatrix();
    camera.rotation.set(pitch, -yaw, 0);
    if (vid.duration) { prog.style.width = (100 * vid.currentTime / vid.duration) + '%'; timeEl.textContent = `${fmt(vid.currentTime)} / ${fmt(vid.duration)}`; }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Load everything, then wait for a tap (sound needs one)
  const texLoad = new Promise((res, rej) => new THREE.TextureLoader().load('equirect.jpg', res, undefined, rej));
  const trackLoad = fetch('track.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const vidLoad = new Promise((res, rej) => { vid.addEventListener('loadeddata', res, { once: true }); vid.addEventListener('error', rej, { once: true }); vid.load(); });
  Promise.all([texLoad, trackLoad, vidLoad]).then(([tex, tr]) => {
    tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
    sphereMat.uniforms.map.value = tex; track = tr;
    const s = sampleTrack(0); yaw = s.lon; pitch = s.lat;
    goBtn.disabled = false; goBtn.textContent = 'להיכנס לרגע';
    requestAnimationFrame(frame);
  }).catch(() => fail('חלק מהקבצים לא נטענו. נסה לרענן את הדף.'));

  const playBtn = document.getElementById('play');
  goBtn.addEventListener('click', () => {
    vid.play().then(() => {
      document.getElementById('veil').hidden = true; document.getElementById('bar').hidden = false;
    }).catch(() => { statusEl.textContent = 'הדפדפן חסם את ההפעלה. לחץ שוב.'; });
  });
  playBtn.addEventListener('click', () => { if (vid.paused) vid.play(); else vid.pause(); });
  vid.addEventListener('play', () => { playBtn.textContent = 'השהיה'; });
  vid.addEventListener('pause', () => { playBtn.textContent = 'ניגון'; });
})();
</script>
